<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pong Game</title>
<style>

.popup {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background-color: rgba(0, 0, 0, 0.7);
    padding: 10px;
    border-radius: 5px;
    z-index: 9999;
  }

  .popup-image {
    display: block;
    max-width: 100%;
    max-height: 300px;
    margin: 0 auto;
  }
  body {
    margin: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 16px;
    height: 100vh;
    background-color: black;
  }
  .site-nav {
    background-color: khaki;
    border: 3px double purple;
    display: flex;
    justify-content: center;
    gap: 8px;
    padding: 10px;
  }
  .site-nav button {
    background-color: lightblue;
    border: 2px outset purple;
    font-weight: bold;
  }
  .site-nav a {
    color: purple;
    text-decoration: none;
  }
  canvas {
    border: 2px solid white;
  }
</style>
</head>
<body>
<div class="site-nav">
  <button><a href="index.html">Home</a></button>
  <button><a href="grapefarm.html">GrapeFarm</a></button>
  <button><a href="ms_wangen.html">Wangenator</a></button>
</div>
<canvas id="gameCanvas" width="800" height="600"></canvas>
<script>
 const images = [
    "images/283EAC6D-C475-4364-880B-2701DDFF0B78_1_105_c.jpeg",
    "images/7A8BE304-9ABA-4522-84C7-B875F32BE003_1_105_c.jpeg",
    "images/0F93BB0F-73AC-48B2-A6AF-8D530D197FB4_1_105_c.jpeg",
    "images/IMG_6077.jpeg",
    "images/IMG_5487.jpeg",
    "images/IMG_6073.jpeg",
    "images/IMG_6070.jpeg",
    "images/IMG_5383.jpeg",
    "images/Screenshot_2023-02-16_7.58.01_AM.png",
    "images/IMG_5017.jpeg",
    "images/IMG_5710.jpeg",
    "images/IMG_5464.jpeg",
    "images/IMG_6074.jpeg",
    "images/IMG_4820.JPG",
    "images/IMG_5985.jpeg",
    "images/IMG_5228.jpeg",
    "images/IMG_4713.GIF",
    "images/B.Piano.png",
    "images/IMG_4990.JPG",
    "images/IMG_5771.JPG",
    "images/IMG_4821.JPG",
    "images/IMG_4561.jpeg",
    "images/IMG_4717.jpeg",
    "images/IMG_4716.jpeg",
    "images/image.png",
    "images/IMG_4695.JPG",
    "images/IMG_4697.JPG",
    "images/IMG_4635.jpeg",
    "images/IMG_4415.jpeg",
    "images/IMG_1102.jpeg",
    "images/IMG_4340.jpeg",
    "images/IMG_3835.JPG",
    "images/IMG_3909.jpeg",
    "images/IMG_3503.jpeg",
    "images/IMG_3834.jpeg",
    "images/IMG_6068.jpeg",
    "images/windows_xp.gif",
    "images/IMG_5187.JPG",
    "images/IMG_4791.JPG",
    
    // Add more image URLs here

  ];

  function getRandomImage() {
    const randomIndex = Math.floor(Math.random() * images.length);
    return images[randomIndex];
  }

  let activePopup = null;
  let activePopupTimer = null;

  function clearActivePopup() {
    if (activePopupTimer) {
      clearTimeout(activePopupTimer);
      activePopupTimer = null;
    }

    if (activePopup) {
      activePopup.remove();
      activePopup = null;
    }
  }

  function showMessageWithImage(imageURL) {
    clearActivePopup();

    const popup = document.createElement("div");
    popup.className = "popup";

    const image = new Image();
    image.className = "popup-image";
    image.decoding = "async";
    image.src = imageURL;

    popup.appendChild(image);
    document.body.appendChild(popup);
    activePopup = popup;

    activePopupTimer = setTimeout(() => {
      clearActivePopup();
    }, 2000); // Popup will disappear after 2 seconds
  }
  const canvas = document.getElementById("gameCanvas");
  const ctx = canvas.getContext("2d");

  const ball = {
    x: canvas.width / 2,
    y: canvas.height / 2,
    radius: 10,
    dx: 4,
    dy: -4,
  };

  const paddle = {
    width: 100,
    height: 10,
    x: (canvas.width - 100) / 2,
    y: canvas.height - 20,
    speed: 17,
  };

  function drawBall() {
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
    ctx.fillStyle = "white";
    ctx.fill();
    ctx.closePath();
  }

  function drawPaddle() {
    ctx.beginPath();
    ctx.rect(paddle.x, paddle.y, paddle.width, paddle.height);
    ctx.fillStyle = "white";
    ctx.fill();
    ctx.closePath();
  }

  function updateGameArea() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Update ball position
    ball.x += ball.dx;
    ball.y += ball.dy;

    if (ball.y + ball.radius > canvas.height) {
      const randomImageURL = getRandomImage();
      showMessageWithImage(randomImageURL);
      ball.x = canvas.width / 2;
      ball.y = canvas.height / 2;
      ball.dx = 4;
      ball.dy = -4;
    }

    // Ball collision with walls
    if (ball.x + ball.radius > canvas.width || ball.x - ball.radius < 0) {
      ball.dx = -ball.dx;
    }
    if (ball.y - ball.radius < 0) {
      ball.dy = -ball.dy;
    }

    // Ball collision with paddle
    if (
      ball.y + ball.radius > paddle.y &&
      ball.x > paddle.x &&
      ball.x < paddle.x + paddle.width
    ) {
      ball.dy = -ball.dy;
    }

    drawBall();
    drawPaddle();

    requestAnimationFrame(updateGameArea);
  }

  document.addEventListener("keydown", (e) => {
    if (e.key === "ArrowLeft" && paddle.x > 0) {
      paddle.x -= paddle.speed;
    } else if (e.key === "ArrowRight" && paddle.x + paddle.width < canvas.width) {
      paddle.x += paddle.speed;
    }
  });

  updateGameArea();
</script>
</body>
</html>
