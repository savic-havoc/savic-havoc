<!DOCTYPE html>
<html>
<head>
    <title>Savic's Luck!!</title>
    <style>
        body {
            font-family: Arial, sans-serif;
        }
        .site-nav {
            background-color: khaki;
            border: 3px double purple;
            display: flex;
            justify-content: center;
            gap: 8px;
            padding: 10px;
        }
        .site-nav button {
            background-color: lightblue;
            border: 2px outset purple;
            font-weight: bold;
        }
        .site-nav a {
            color: purple;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="site-nav">
        <button><a href="index.html">Home</a></button>
        <button><a href="grapefarm.html">GrapeFarm</a></button>
        <button><a href="ms_wangen.html">Wangenator</a></button>
    </div>
    <h1>Savic's Number Guesser</h1>
    <p>Try to guess the randomly generated number between 1 and 100.</p>
    <input type="number" id="guess" placeholder="Enter your guess">
    <button id="guessButton" onclick="checkGuess()">Check Guess</button>
    <p id="message"></p>

    <script>
        alert("BOO! GOT YA POKEY!")
        // Generate a random number between 1 and 100
        let targetNumber = Math.floor(Math.random() * 100) + 1;
        let numberOfGuesses = 0;
        let gameOver = false;

        function checkGuess() {
            if (gameOver) {
                return;
            }

            const guess = parseInt(document.getElementById("guess").value);

            if (isNaN(guess) || guess < 1 || guess > 100) {
                setMessage("Please enter a valid number between 1 and 100.");
                return;
            }

            numberOfGuesses++;

            if (guess === targetNumber) {
                if (targetNumber === 88) {
                    setMessage(`Uhhhh, how do you know about 1988? That was the correct guess! You win, pokey!
                    You guessed the number ${targetNumber} in ${numberOfGuesses} guesses.`);
                } else {
                    setMessage(`Geez, pokey! You guessed the number ${targetNumber} in ${numberOfGuesses} guesses.`);
                }

                gameOver = true;
                setTimeout(askToPlayAgain, 100);

                return;
            } else if (guess < targetNumber) {
                setMessage("Try a higher number.");
            } else {
                setMessage("Try a lower number.");
            }
        }

        function resetGame() {
            targetNumber = Math.floor(Math.random() * 100) + 1;
            numberOfGuesses = 0;
            gameOver = false;
            document.getElementById("guess").value = "";
            document.getElementById("guess").disabled = false;
            document.getElementById("guessButton").disabled = false;
            setMessage("New game started. Guess a number between 1 and 100.");
        }

        function askToPlayAgain() {
            const playAgain = confirm("Would you like to play again?");

            if (playAgain) {
                resetGame();
            } else {
                document.getElementById("guess").disabled = true;
                document.getElementById("guessButton").disabled = true;
            }
        }

        function setMessage(message) {
            document.getElementById("message").textContent = message;
        }
    </script>
</body>
</html>
